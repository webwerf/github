# Reusable CI Slack Notification Workflow
# Usage: uses: wouterhendriks/github/.github/workflows/ci-slack.yml@v2
#
# Required secret in calling repo: SLACK_WEBHOOK_URL
#
# Example usage in app repo:
#   notify:
#     needs: build
#     if: always() && github.ref == 'refs/heads/master'
#     uses: wouterhendriks/github/.github/workflows/ci-slack.yml@v2
#     with:
#       status: ${{ needs.build.result }}
#       workflow_name: test.yml
#     secrets:
#       SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

name: CI Slack Notifications

on:
  workflow_call:
    inputs:
      status:
        description: "Job result: 'success' or 'failure'"
        required: true
        type: string
      workflow_name:
        description: "Name of the workflow file (e.g. 'test.yml') for recovery detection"
        required: true
        type: string
      notify_on_success:
        description: "Send notification on every success (for debugging)"
        required: false
        type: boolean
        default: false
    secrets:
      SLACK_WEBHOOK_URL:
        description: "Slack Incoming Webhook URL"
        required: true

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check for recovery
        id: recovery
        if: inputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '${{ inputs.workflow_name }}',
              branch: branch,
              per_page: 2
            });

            const workflowRuns = runs.data.workflow_runs;

            if (workflowRuns.length < 2) {
              console.log('Not enough workflow runs to determine recovery');
              core.setOutput('is_recovery', 'false');
              return;
            }

            const previous = workflowRuns[1];
            console.log(`Previous run conclusion: ${previous.conclusion}`);

            if (previous.conclusion === 'failure') {
              console.log('Previous run failed - this is a recovery!');
              core.setOutput('is_recovery', 'true');
            } else {
              core.setOutput('is_recovery', 'false');
            }

      - name: Send failure notification
        if: inputs.status == 'failure'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🔴 *CI failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.event.head_commit.message }}\nAuthor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }

      - name: Send recovery notification
        if: inputs.status == 'success' && steps.recovery.outputs.is_recovery == 'true'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🟢 *CI fixed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.event.head_commit.message }}\nAuthor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }

      - name: Send success notification (debug)
        if: inputs.status == 'success' && inputs.notify_on_success == true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ *CI passed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.event.head_commit.message }}\nAuthor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
