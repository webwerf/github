# Reusable CI Slack Notification Workflow
# Usage: uses: wouterhendriks/github/.github/workflows/ci-slack.yml@v2
#
# Required secret in calling repo: SLACK_WEBHOOK_URL
#
# Example usage in app repo:
#   notify:
#     needs: build
#     if: always() && github.ref == 'refs/heads/master'
#     uses: wouterhendriks/github/.github/workflows/ci-slack.yml@v2
#     with:
#       status: ${{ needs.build.result }}
#       workflow_name: test.yml
#     secrets:
#       SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

name: CI Slack Notifications

on:
  workflow_call:
    inputs:
      status:
        description: "Job result: 'success' or 'failure'"
        required: true
        type: string
      workflow_name:
        description: "Name of the workflow file (e.g. 'test.yml') for recovery detection"
        required: true
        type: string
      notify_on_success:
        description: "Send notification on every success (for debugging)"
        required: false
        type: boolean
        default: false
    secrets:
      SLACK_WEBHOOK_URL:
        description: "Slack Incoming Webhook URL"
        required: true

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare commit message
        id: commit
        run: |
          # Take first line only, escape backslashes, double quotes, and control chars for JSON
          MSG=$(echo "$RAW_MSG" | head -1 | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g')
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"
        env:
          RAW_MSG: ${{ github.event.head_commit.message }}

      - name: Check for recovery
        id: recovery
        if: inputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');

            // Identify the previous run by id, never by list position. Taking workflowRuns[1]
            // assumes index 0 is always this run, and reads one run too far back whenever the
            // in-progress run is absent from the response. That only misfires after a SINGLE
            // red run, because during a failure streak the older run is red as well, so it
            // survives every test done on a streak. Asking for completed runs already drops
            // this run (it is in progress while this step executes); the id check is the guard.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '${{ inputs.workflow_name }}',
              branch: branch,
              status: 'completed',
              per_page: 5
            });

            // Skip cancelled and skipped runs: they carry no verdict to recover from.
            const previous = runs.data.workflow_runs.find(run =>
              run.id !== context.runId && ['success', 'failure'].includes(run.conclusion));

            if (!previous) {
              console.log('No earlier conclusive run on this branch to compare against');
              core.setOutput('is_recovery', 'false');
              return;
            }

            console.log(`Previous run ${previous.id} (${previous.head_sha.slice(0, 8)}) conclusion: ${previous.conclusion}`);

            if (previous.conclusion === 'failure') {
              console.log('Previous run failed - this is a recovery!');
              core.setOutput('is_recovery', 'true');
            } else {
              core.setOutput('is_recovery', 'false');
            }

      - name: Send failure notification
        if: inputs.status == 'failure'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🔴 *CI failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ steps.commit.outputs.msg }}\nAuthor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\n```/github-build-fixer ${{ github.repository }}/actions/runs/${{ github.run_id }}```"
            }

      - name: Send recovery notification
        if: inputs.status == 'success' && steps.recovery.outputs.is_recovery == 'true'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🟢 *CI fixed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ steps.commit.outputs.msg }}\nAuthor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }

      - name: Send success notification (debug)
        if: inputs.status == 'success' && inputs.notify_on_success == true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ *CI passed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ steps.commit.outputs.msg }}\nAuthor: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
